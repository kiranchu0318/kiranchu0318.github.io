<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>組織圖設定</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#4A90E2', 'primary-light': '#EAF2FC' } } }
        }
    </script>
    <link rel="stylesheet" href="shared-ui.css">
    <style>
        /* 組織圖：巢狀樹狀（節點方塊 + 連接線） */
        .org-tree { display: inline-block; min-width: 100%; text-align: center; }
        .org-tree ul { display: flex; justify-content: center; padding-top: 24px; position: relative; margin: 0; list-style: none; }
        .org-tree > ul { padding-top: 0; }
        .org-tree li { list-style: none; display: flex; flex-direction: column; align-items: center; position: relative; padding: 24px 14px 0; }
        /* 子節點上方連接線 */
        .org-tree li::before, .org-tree li::after { content: ''; position: absolute; top: 0; right: 50%; width: 50%; height: 24px; border-top: 2px solid #cbd5e1; }
        .org-tree li::after { right: auto; left: 50%; border-left: 2px solid #cbd5e1; }
        .org-tree li:only-child::after, .org-tree li:only-child::before { display: none; }
        .org-tree li:only-child { padding-top: 24px; }
        .org-tree li:first-child::before, .org-tree li:last-child::after { border: 0 none; }
        .org-tree li:last-child::before { border-right: 2px solid #cbd5e1; border-radius: 0 8px 0 0; }
        .org-tree li:first-child::after { border-radius: 8px 0 0 0; }
        /* 由父節點往下的垂直線 */
        .org-tree ul ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid #cbd5e1; width: 0; height: 24px; }
        /* 最上層節點不畫上方連接線 */
        .org-tree > ul > li::before, .org-tree > ul > li::after { display: none; }
    </style>
</head>
<body class="ui-page text-text-main antialiased relative">

    <div class="relative mx-auto w-full space-y-6">

        <!-- 頁面標題區塊 -->
        <header class="ui-page-header">
            <h1 class="ui-page-title">組織圖設定</h1>
        </header>

        <section class="ui-card flex flex-col p-4 sm:p-6 space-y-4">

            <!-- 工具列：搜尋 + 展開/收合 + 新增頂層單位 -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
                <div class="flex flex-wrap items-center gap-2">
                    <div class="ui-search w-full sm:w-72">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search" oninput="render()" placeholder="搜尋單位名稱 / 主管..." class="ui-input ui-search-input">
                    </div>
                    <button onclick="expandAll(true)" class="ui-btn ui-btn-secondary ui-btn-sm"><i class="fa-solid fa-angles-down"></i> 全部展開</button>
                    <button onclick="expandAll(false)" class="ui-btn ui-btn-secondary ui-btn-sm"><i class="fa-solid fa-angles-up"></i> 全部收合</button>
                </div>
            </div>

            <div class="overflow-x-auto rounded-lg border border-gray-100 bg-gray-50/40 p-4 sm:p-8">
                <div class="org-tree" id="org-tree"></div>
            </div>

            <div id="no-data" class="hidden py-16 text-center space-y-3">
                <div class="inline-flex p-4 bg-gray-50 text-gray-400 rounded-full"><i class="fa-solid fa-sitemap text-3xl"></i></div>
                <p class="text-sm text-gray-500 font-medium">查無符合條件的組織單位</p>
            </div>
        </section>

    </div>

    <!-- ============ 新增 / 編輯 組織單位 彈窗 ============ -->
    <div id="org-modal" class="fixed inset-0 bg-black/40 z-50 flex justify-center items-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-modal w-full max-w-md overflow-hidden">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
                <h3 id="org-modal-title" class="text-base font-bold text-gray-900">新增組織單位</h3>
                <button onclick="closeOrgModal()" class="text-gray-400 hover:text-gray-600 w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="px-6 py-5 space-y-4">
                <div id="parent-hint" class="hidden text-xs text-gray-500 bg-gray-50 rounded-lg px-3 py-2"></div>
                <div>
                    <label class="block text-xs font-semibold text-text-muted mb-1.5">單位名稱 <span class="text-rose-500">*</span></label>
                    <input type="text" id="org-name" placeholder="例如：研發事業部" class="ui-input">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-text-muted mb-1.5">單位類型 <span class="text-rose-500">*</span></label>
                    <select id="org-type" class="ui-select bg-gray-100 text-gray-500 cursor-not-allowed" disabled>
                        <option>公司</option>
                        <option>事業部</option>
                        <option>中心</option>
                        <option>部門</option>
                        <option>組</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-text-muted mb-1.5">單位主管</label>
                    <div class="relative" id="org-head-combo">
                        <input type="text" id="org-head" autocomplete="off" placeholder="搜尋員工姓名 / 工號" class="ui-input">
                        <div id="org-head-list" class="hidden absolute z-30 left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-48 overflow-y-auto text-sm"></div>
                    </div>
                </div>
                <div id="org-subs-wrap">
                    <label class="block text-xs font-semibold text-text-muted mb-1.5">下屬（可多選）</label>
                    <div class="relative" id="org-subs-combo">
                        <div id="org-subs-box" class="ui-input flex flex-wrap items-center gap-1.5 min-h-[42px] h-auto py-1.5 cursor-text">
                            <div id="org-subs-chips" class="contents"></div>
                            <input type="text" id="org-subs-input" autocomplete="off" placeholder="搜尋員工姓名 / 工號" class="flex-1 min-w-[120px] border-0 outline-none bg-transparent text-sm p-0">
                        </div>
                        <div id="org-subs-list" class="hidden absolute z-30 left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-48 overflow-y-auto text-sm"></div>
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-2.5 px-6 py-4 bg-gray-50 border-t border-gray-100">
                <button onclick="closeOrgModal()" class="ui-btn ui-btn-secondary">取消</button>
                <button onclick="saveOrg()" class="ui-btn ui-btn-primary">儲存</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] flex items-center gap-2 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-2xl text-sm font-medium opacity-0 translate-y-3 transition-all duration-300 pointer-events-none">
        <i class="fa-solid fa-circle-check text-emerald-400"></i><span id="toast-text"></span>
    </div>

    <script>
        // 組織結構（依「集團組織圖_20260729.xmind」生成；BU1/BU2/BU4/GT 起算最多四層；僅 資訊組(MIS) 實際到第四層，其餘維持原深度不補層）

                                ] },
                            ] },
                            { id: 46, name: '運維中心 (NOC)', type: '中心', head: '', subs: [], children: [
                                { id: 47, name: '運維部 (NOC-BOPS)', type: '部門', head: '', subs: [], children: [] },
                                { id: 48, name: 'DBA部 (NOC-DBA)', type: '部門', head: '', subs: [], children: [] },
                                { id: 49, name: '資安部 (NOC-IS)', type: '部門', head: '', subs: [], children: [] },
                                { id: 50, name: '職能一部 (BOPS-GA1)', type: '部門', head: '', subs: [], children: [] },
                                { id: 51, name: '職能二部 (BOPS-GA2)', type: '部門', head: '', subs: [], children: [] },
                            ] },
                            { id: 52, name: '項目管理辦公室 (PMO)', type: '組', head: '', subs: [], children: [] },
                            { id: 53, name: '客服中心 (CSC)', type: '中心', head: '', subs: [], children: [
                                { id: 54, name: 'CSC-D1', type: '組', head: '', subs: [], children: [] },
                                { id: 55, name: 'CSC-D2', type: '組', head: '', subs: [], children: [] },
                                { id: 56, name: 'CSC-HR', type: '組', head: '', subs: [], children: [] },
                                { id: 57, name: 'CSC-AD', type: '組', head: '', subs: [], children: [] },
                            ] },
                            { id: 58, name: '財務中心 (FAC)', type: '中心', head: '', subs: [], children: [
                                { id: 59, name: 'ACC', type: '組', head: '', subs: [], children: [] },
                                { id: 60, name: 'FIN', type: '組', head: '', subs: [], children: [] },
                            ] },
                            { id: 61, name: '人事中心 (HRC)', type: '中心', head: '', subs: [], children: [] },
                            { id: 62, name: '行政中心 (ADC)', type: '中心', head: '', subs: [], children: [] },
                            { id: 63, name: '法務中心 (LGL)', type: '中心', head: '', subs: [], children: [] },
                            { id: 64, name: '內審一部 (IA1)', type: '部門', head: '', subs: [], children: [] },
                            { id: 65, name: '內審二部 (IA2)', type: '部門', head: '', subs: [], children: [] },
                        ] },
                    ] },
                ] },
            ] }
        ];
        let nextId = 100;
        const expanded = new Set([1, 2, 3, 30, 31]);

        let modalMode = 'add-top'; // add-top | add-child | edit
        let modalRefId = null;     // add-child: 父單位 id；edit: 該單位 id

        const TYPE_META = {
            '公司':   { badge: 'ui-badge-info',    icon: 'fa-building' },
            '事業部': { badge: 'ui-badge-success', icon: 'fa-sitemap' },
            '中心':   { badge: 'ui-badge-warning', icon: 'fa-building-user' },
            '部門':   { badge: 'ui-badge-gray',    icon: 'fa-users' },
            '組':     { badge: 'ui-badge-gray',    icon: 'fa-user-group' }
        };
        const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        // 員工清單（供 單位主管 / 下屬 搜尋選擇）
        const EMPLOYEES = [
            { name: 'Oliver', id: '100962' }, { name: 'James', id: '101517' }, { name: 'Nick', id: '100064' },
            { name: 'Dev', id: '101366' }, { name: 'Stella', id: '100120' }, { name: 'Cora', id: '101081' },
            { name: 'Henry', id: '100016' }, { name: 'Lucas', id: '100324' }, { name: 'Arthur', id: '101023' },
            { name: 'Daniel', id: '100052' }, { name: 'William', id: '101372' }, { name: 'Thomas', id: '100344' },
            { name: 'Logan', id: '100211' }, { name: 'Mia', id: '100455' }, { name: 'Luna', id: '100788' }
        ];
        const empLabel = e => `${e.name}（${e.id}）`;
        let orgSubs = []; // 下屬（工號陣列）

        // 層級計算：BU1/BU2/BU4/GT 起算為第 1 層，往下最多第 4 層；只有第 4 層（最後一層）可設定下屬
        const START_NAMES = new Set(['BU1', 'BU2', 'BU4', 'GT']);
        let LEVELS = {};
        function computeLevels(nodes = orgTree, parentLevel = null) {
            nodes.forEach(n => {
                const lv = START_NAMES.has(n.name) ? 1 : (parentLevel == null ? null : parentLevel + 1);
                LEVELS[n.id] = lv;
                computeLevels(n.children, lv);
            });
        }
        const isLastLevel = n => LEVELS[n.id] != null && n.children.length === 0; // 最後一層（該分支的葉節點）
        const canAddChild = n => LEVELS[n.id] == null || LEVELS[n.id] < 4; // 未達第四層才可再增子單位

        // 依層級套用不同卡片配色（BU/GT 起算 1~4 層；起算層之上為結構層）
        const LEVEL_STYLE = {
            'top': 'bg-slate-50 border-slate-300',   // 結構層（董事會 / GMO / 事業部 / 中心側）
            1:     'bg-blue-50 border-blue-300',      // 第 1 層（BU1/BU2/BU4/GT）
            2:     'bg-emerald-50 border-emerald-300',// 第 2 層
            3:     'bg-amber-50 border-amber-300',    // 第 3 層
            4:     'bg-violet-50 border-violet-300'   // 第 4 層（最後一層）
        };
        const levelStyle = n => LEVEL_STYLE[LEVELS[n.id] == null ? 'top' : LEVELS[n.id]] || 'bg-white border-gray-200';

        // 依層級掛標籤：第 1 層 事業部（GT 為中心）、第 2 層 部門、第 3 層以下 組別；結構層不掛
        const BADGE_STYLE = { '事業部/中心': 'ui-badge-info', '部門': 'ui-badge-success', '組別': 'ui-badge-gray' };
        function levelBadge(n) {
            const lv = LEVELS[n.id];
            if (lv == null) return '';
            if (lv === 1) return '事業部/中心';
            if (lv === 2) return '部門';
            return '組別';
        }

        function findNode(id, nodes = orgTree) {
            for (const n of nodes) { if (n.id === id) return n; const f = findNode(id, n.children); if (f) return f; }
            return null;
        }
        function removeNode(id, nodes = orgTree) {
            const i = nodes.findIndex(n => n.id === id);
            if (i >= 0) { nodes.splice(i, 1); return true; }
            for (const n of nodes) { if (removeNode(id, n.children)) return true; }
            return false;
        }
        function subtreeMatch(n, kw) {
            if (!kw) return true;
            if (n.name.toLowerCase().includes(kw) || (n.head || '').toLowerCase().includes(kw)) return true;
            return n.children.some(c => subtreeMatch(c, kw));
        }
        function allIds(nodes = orgTree, acc = []) { nodes.forEach(n => { acc.push(n.id); allIds(n.children, acc); }); return acc; }

        function nodeBox(n, kw) {
            const meta = TYPE_META[n.type] || TYPE_META['組'];
            const has = n.children.length > 0;
            const open = kw ? true : expanded.has(n.id);
            const toggle = has
                ? `<button onclick="toggle(${n.id})" class="w-5 h-5 flex items-center justify-center rounded text-gray-400 hover:text-primary hover:bg-primary-light shrink-0" title="${open ? '收合' : '展開'}"><i class="fa-solid ${open ? 'fa-chevron-down' : 'fa-chevron-right'} text-[10px]"></i></button>`
                : '';
            const badge = has ? `<span class="ml-1 text-[10px] text-gray-400">(${n.children.length})</span>` : '';
            return `
                <div class="org-node group relative inline-block border ${levelStyle(n)} rounded-xl shadow-sm px-4 py-3 min-w-[171px] hover:border-primary/60 hover:shadow-md transition-all">
                    <div class="flex items-center justify-center gap-2">
                        ${toggle}
                        <i class="fa-solid ${meta.icon} text-primary shrink-0"></i>
                        <span class="font-bold text-gray-800 text-sm">${esc(n.name)}</span>${badge}
                    </div>
                    <div class="flex items-center justify-center gap-1.5 mt-1.5">
                        ${(() => { const lb = levelBadge(n); return lb ? `<span class="ui-badge ${BADGE_STYLE[lb] || 'ui-badge-gray'} text-[10px]">${lb}</span>` : ''; })()}
                        <span class="text-xs text-gray-400">${esc(n.head || '—')}${isLastLevel(n) ? ' · 下屬 ' + ((n.subs && n.subs.length) || 0) + ' 人' : ''}</span>
                    </div>
                    <div class="flex items-center justify-center gap-1 mt-2 opacity-0 group-hover:opacity-100 transition-opacity">
                        ${canAddChild(n) ? `<button onclick="openAddChild(${n.id})" class="w-6 h-6 rounded flex items-center justify-center text-gray-400 hover:text-primary hover:bg-primary-light" title="新增子單位"><i class="fa-solid fa-plus text-xs"></i></button>` : ''}
                        <button onclick="openEdit(${n.id})" class="w-6 h-6 rounded flex items-center justify-center text-gray-400 hover:text-primary hover:bg-primary-light" title="編輯"><i class="fa-solid fa-pen text-xs"></i></button>
                        <button onclick="delNode(${n.id})" class="w-6 h-6 rounded flex items-center justify-center text-gray-400 hover:text-rose-600 hover:bg-rose-50" title="刪除"><i class="fa-solid fa-trash-can text-xs"></i></button>
                    </div>
                </div>`;
        }

        function render() {
            LEVELS = {}; computeLevels();
            const kw = (document.getElementById('search').value || '').trim().toLowerCase();
            const li = (n) => {
                if (kw && !subtreeMatch(n, kw)) return '';
                const has = n.children.length > 0;
                const open = kw ? true : expanded.has(n.id);
                const childrenHtml = (has && open) ? '<ul>' + n.children.map(li).join('') + '</ul>' : '';
                return `<li>${nodeBox(n, kw)}${childrenHtml}</li>`;
            };
            const inner = orgTree.map(li).join('');
            document.getElementById('org-tree').innerHTML = inner ? '<ul>' + inner + '</ul>' : '';
            const empty = inner === '';
            document.getElementById('no-data').classList.toggle('hidden', !empty);
            document.getElementById('org-tree').parentElement.classList.toggle('hidden', empty);
        }

        function toggle(id) { expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); }
        function expandAll(open) {
            expanded.clear();
            if (open) allIds().forEach(id => expanded.add(id));
            render();
        }

        /* ============ 新增 / 編輯 ============ */
        function fillForm(name, type, head, subs) {
            document.getElementById('org-name').value = name || '';
            document.getElementById('org-type').value = type || '公司';
            document.getElementById('org-head').value = head || '';
            orgSubs = Array.isArray(subs) ? subs.slice() : [];
            renderSubChips();
        }
        function setHint(text) {
            const h = document.getElementById('parent-hint');
            if (text) { h.innerText = text; h.classList.remove('hidden'); } else { h.classList.add('hidden'); }
        }
        // 只有最後一層（第四層）可設定下屬名單
        function toggleSubsField(show) {
            document.getElementById('org-subs-wrap').classList.toggle('hidden', !show);
        }
        function openAddChild(parentId) {
            modalMode = 'add-child'; modalRefId = parentId;
            const p = findNode(parentId);
            document.getElementById('org-modal-title').innerText = '新增子單位';
            setHint('上層單位：' + (p ? p.name : ''));
            fillForm('', '部門', '', []);
            const pLv = LEVELS[parentId];
            toggleSubsField(pLv != null && pLv + 1 <= 4);  // 新子單位為該分支葉節點 → 可設定下屬
            document.getElementById('org-modal').classList.remove('hidden');
        }
        function openEdit(id) {
            modalMode = 'edit'; modalRefId = id;
            const n = findNode(id);
            if (!n) return;
            document.getElementById('org-modal-title').innerText = '編輯組織單位';
            setHint('');
            fillForm(n.name, n.type, n.head, n.subs);
            toggleSubsField(isLastLevel(n));
            document.getElementById('org-modal').classList.remove('hidden');
        }
        function closeOrgModal() { document.getElementById('org-modal').classList.add('hidden'); }

        function saveOrg() {
            const name = document.getElementById('org-name').value.trim();
            const type = document.getElementById('org-type').value;
            const head = document.getElementById('org-head').value.trim();
            const subs = orgSubs.slice();
            if (!name) { showToast('請輸入單位名稱'); return; }

            if (modalMode === 'edit') {
                const n = findNode(modalRefId);
                if (n) { n.name = name; n.type = type; n.head = head; n.subs = subs; n.count = subs.length; }
                showToast('已更新組織單位');
            } else {
                const node = { id: ++nextId, name, type, head, subs, count: subs.length, children: [] };
                if (modalMode === 'add-child') {
                    const p = findNode(modalRefId);
                    if (p) { p.children.push(node); expanded.add(p.id); }
                    showToast('已新增子單位');
                } else {
                    orgTree.push(node);
                    showToast('已新增頂層單位');
                }
            }
            closeOrgModal();
            render();
        }

        function delNode(id) {
            const n = findNode(id);
            if (!n) return;
            const cnt = n.children.length;
            const msg = cnt ? `確定要刪除「${n.name}」及其 ${cnt} 個子單位嗎？` : `確定要刪除「${n.name}」嗎？`;
            if (!confirm(msg)) return;
            removeNode(id);
            render();
            showToast('已刪除組織單位');
        }

        /* ============ Toast ============ */
        let toastTimer = null;
        function showToast(text) {
            const t = document.getElementById('toast');
            document.getElementById('toast-text').innerText = text;
            t.style.opacity = '1'; t.style.transform = 'translate(-50%, 0)';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translate(-50%, 12px)'; }, 2200);
        }

        /* ============ 單位主管：搜尋員工下拉 ============ */
        (function setupHeadCombo() {
            const combo = document.getElementById('org-head-combo');
            const input = document.getElementById('org-head');
            const list = document.getElementById('org-head-list');
            const render = () => {
                const k = (input.value || '').trim().toLowerCase();
                const items = EMPLOYEES.filter(e => !k || e.name.toLowerCase().includes(k) || e.id.includes(k));
                list.innerHTML = items.length
                    ? items.map(e => `<div class="px-3 py-2 hover:bg-primary-light cursor-pointer" data-val="${esc(empLabel(e))}">${esc(e.name)}<span class="text-gray-400">（${e.id}）</span></div>`).join('')
                    : '<div class="px-3 py-2 text-gray-400">查無符合的員工</div>';
                list.classList.remove('hidden');
            };
            input.addEventListener('focus', render);
            input.addEventListener('input', render);
            list.addEventListener('mousedown', e => {
                const opt = e.target.closest('[data-val]');
                if (!opt) return;
                input.value = opt.getAttribute('data-val');
                list.classList.add('hidden');
            });
            document.addEventListener('click', e => { if (!combo.contains(e.target)) list.classList.add('hidden'); });
        })();

        /* ============ 下屬：多選員工 ============ */
        function renderSubChips() {
            const box = document.getElementById('org-subs-chips');
            box.innerHTML = orgSubs.map(id => {
                const e = EMPLOYEES.find(x => x.id === id);
                const label = e ? e.name : id;
                return `<span class="inline-flex items-center gap-1 bg-primary-light text-primary rounded px-2 py-0.5 text-xs">${esc(label)}<button type="button" onclick="removeSub('${id}')" class="hover:text-rose-600"><i class="fa-solid fa-xmark text-[10px]"></i></button></span>`;
            }).join('');
        }
        function removeSub(id) { orgSubs = orgSubs.filter(x => x !== id); renderSubChips(); }
        (function setupSubsCombo() {
            const combo = document.getElementById('org-subs-combo');
            const box = document.getElementById('org-subs-box');
            const input = document.getElementById('org-subs-input');
            const list = document.getElementById('org-subs-list');
            const render = () => {
                const k = (input.value || '').trim().toLowerCase();
                const items = EMPLOYEES.filter(e => !orgSubs.includes(e.id) && (!k || e.name.toLowerCase().includes(k) || e.id.includes(k)));
                list.innerHTML = items.length
                    ? items.map(e => `<div class="px-3 py-2 hover:bg-primary-light cursor-pointer" data-id="${e.id}">${esc(e.name)}<span class="text-gray-400">（${e.id}）</span></div>`).join('')
                    : '<div class="px-3 py-2 text-gray-400">查無可選的員工</div>';
                list.classList.remove('hidden');
            };
            box.addEventListener('click', () => input.focus());
            input.addEventListener('focus', render);
            input.addEventListener('input', render);
            list.addEventListener('mousedown', e => {
                const opt = e.target.closest('[data-id]');
                if (!opt) return;
                const id = opt.getAttribute('data-id');
                if (!orgSubs.includes(id)) orgSubs.push(id);
                input.value = '';
                renderSubChips();
                render();
            });
            document.addEventListener('click', e => { if (!combo.contains(e.target)) list.classList.add('hidden'); });
        })();

        document.getElementById('org-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeOrgModal(); });
        render();
    </script>

</body>
</html>
