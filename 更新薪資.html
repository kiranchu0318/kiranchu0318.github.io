<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新薪資</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4A90E2',
                        'primary-light': '#EAF2FC',
                        background: '#F8F9FB',
                        card: '#FFFFFF',
                        text: { main: '#1F2937', muted: '#6B7280', light: '#9CA3AF' }
                    },
                    fontFamily: {
                        sans: ['"Inter"', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03)',
                        'modal': '0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: theme('colors.background'); font-family: theme('fontFamily.sans'); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .dropzone.is-over { border-color: #4A90E2; background-color: rgba(234, 242, 252, .6); }
    </style>
    <link rel="stylesheet" href="shared-ui.css">
</head>
<body class="ui-page text-text-main antialiased relative">

    <div class="relative mx-auto w-full space-y-6">

        <header class="ui-page-header">
            <h1 class="ui-page-title">更新薪資</h1>
        </header>

        <!-- 批次更新薪資：下載範本 → 填寫 → 上傳 xlsx -->
        <section class="ui-card p-4 sm:p-6 space-y-5">
            <!-- 說明與下載範本 -->
            <div class="rounded-lg border border-blue-100 bg-primary-light/40 p-4 flex items-start justify-between gap-4">
                <div class="flex items-start gap-3 min-w-0">
                    <i class="fa-solid fa-circle-info text-primary mt-0.5 shrink-0"></i>
                    <div class="min-w-0">
                        <p class="text-sm font-bold text-gray-800">請依範本格式填寫後上傳</p>
                        <p class="text-xs text-text-muted mt-0.5">僅接受單一 Excel 檔案（.xlsx）。若檔案中任一列有誤，本次將不會更新任何資料。</p>
                    </div>
                </div>
                <!-- 下載範本：GET /user/payitems/template -->
                <a id="tpl-link" href="/user/payitems/template" onclick="downloadTemplate(event)"
                   class="ui-btn ui-btn-secondary ui-btn-sm shrink-0 whitespace-nowrap"><i class="fa-solid fa-download"></i> 下載範本</a>
            </div>

            <!-- 上傳區（單檔 xlsx） -->
            <div>
                <label class="block text-xs font-semibold text-text-muted mb-1.5">上傳檔案 <span class="text-rose-500">*</span></label>
                <div id="dropzone" class="dropzone border-2 border-dashed border-gray-300 rounded-xl px-6 py-6 text-center transition-colors cursor-pointer hover:border-primary hover:bg-primary-light/40"
                     onclick="document.getElementById('file-input').click()">
                    <div class="flex items-center justify-center gap-3">
                        <div class="inline-flex p-2.5 bg-blue-50 text-primary rounded-full shrink-0"><i class="fa-solid fa-file-arrow-up text-lg"></i></div>
                        <div class="text-left">
                            <p class="text-sm font-semibold text-gray-700">點擊選擇檔案，或將檔案拖曳至此</p>
                            <p class="text-xs text-text-muted mt-0.5">僅接受 Excel 檔案（.xlsx），單次一個檔案</p>
                        </div>
                    </div>
                    <input type="file" id="file-input" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden" onchange="onFileSelect(event)">
                </div>

                <!-- 已選檔案 -->
                <div id="file-preview" class="hidden items-center justify-between gap-3 mt-3 p-3.5 rounded-lg border border-gray-200 bg-gray-50/60">
                    <div class="flex items-center gap-3 min-w-0">
                        <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0"><i class="fa-solid fa-file-excel text-lg"></i></div>
                        <div class="min-w-0">
                            <div id="file-name" class="text-sm font-semibold text-gray-800 truncate"></div>
                            <div id="file-size" class="text-xs text-text-muted"></div>
                        </div>
                    </div>
                    <button id="file-clear" onclick="clearFile()" class="text-gray-400 hover:text-rose-500 transition-colors shrink-0 px-2 py-1" title="移除檔案"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <!-- 更新成功提示 -->
            <div id="success-box" class="hidden items-start gap-3 p-3.5 rounded-lg border border-emerald-200 bg-emerald-50">
                <i class="fa-solid fa-circle-check text-emerald-500 text-lg mt-0.5 shrink-0"></i>
                <div class="min-w-0">
                    <div id="success-title" class="text-sm font-bold text-emerald-700"></div>
                    <div class="text-xs text-emerald-600 mt-0.5">如需再次更新，請重新選擇檔案後送出。</div>
                </div>
            </div>

            <!-- 錯誤清單（上傳失敗時顯示；全部列出，不截斷） -->
            <div id="error-box" class="hidden space-y-2">
                <div class="flex items-start gap-3 p-3.5 rounded-lg border border-rose-200 bg-rose-50">
                    <i class="fa-solid fa-circle-exclamation text-rose-500 text-lg mt-0.5 shrink-0"></i>
                    <div class="min-w-0">
                        <div class="text-sm font-bold text-rose-700">本次未更新任何資料，請修正後重新上傳</div>
                        <div class="text-xs text-rose-600 mt-0.5">檔案已保留於上方，修正後可直接再次送出。</div>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <h4 class="text-xs font-bold text-gray-700">錯誤明細</h4>
                    <span id="error-count" class="bg-rose-50 text-rose-600 text-xs px-2 py-0.5 rounded font-bold">0 筆</span>
                </div>
                <div class="rounded-lg border border-gray-200 overflow-auto custom-scrollbar max-h-72">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-gray-50 text-gray-500 sticky top-0">
                            <tr>
                                <th class="px-3 py-2 w-20 font-medium">列號</th>
                                <th class="px-3 py-2 w-40 font-medium">欄位</th>
                                <th class="px-3 py-2 font-medium">原因</th>
                            </tr>
                        </thead>
                        <tbody id="error-tbody" class="divide-y divide-gray-100 text-gray-700"></tbody>
                    </table>
                </div>
            </div>

            <div class="flex justify-end gap-2.5 pt-1">
                <button id="btn-submit" onclick="submitUpload()" class="ui-btn ui-btn-primary" disabled>
                    <i id="btn-submit-icon" class="fa-solid fa-cloud-arrow-up"></i> <span id="btn-submit-text">開始更新</span>
                </button>
            </div>
        </section>

    </div>

    <!-- 提示消息 (Toast) -->
    <div id="toast" class="fixed bottom-5 right-5 z-[60] flex items-center gap-3 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-modal transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-base"></i>
        <span id="toast-text" class="text-sm font-medium">操作成功！</span>
    </div>

    <script>
        /* ============================================================
           更新薪資
           批次更新薪資：下載範本 → 填寫 → 上傳 xlsx（內容直接呈現於畫面，無彈窗）。
           上傳採全有全無：任一列有誤即不更新任何資料，並列出全部錯誤。
           ============================================================ */

        const TEMPLATE_URL = '/user/payitems/template';   // GET：下載薪資項目範本
        const UPLOAD_URL = '/user/payitems/batch';        // POST：批次更新（multipart/form-data）
        const MOCK_UPDATED = 5;                           // 原型用：模擬後端回傳之更新人數

        let selectedFile = null;
        let uploading = false;

        const esc = (v) => String(v == null ? '' : v)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

        /* ===== 下載範本 ===== */
        // 原型：攔截導覽並以 Toast 說明；正式版移除 onclick，由 href 直接 GET 範本
        function downloadTemplate(e) {
            e.preventDefault();
            showToast('info', `將下載薪資項目範本（GET ${TEMPLATE_URL}）`);
        }

        /* ===== 檔案選擇 ===== */
        const fmtSize = (b) => b < 1024 ? b + ' B'
            : b < 1048576 ? (b / 1024).toFixed(1) + ' KB'
            : (b / 1048576).toFixed(1) + ' MB';

        function onFileSelect(e) {
            const f = (e.target.files || [])[0];
            e.target.value = '';           // 同一檔案可重新選取
            if (f) acceptFile(f);
        }
        function acceptFile(f) {
            if (!/\.xlsx$/i.test(f.name)) {
                showToast('error', '僅接受 .xlsx 檔案');
                return;
            }
            selectedFile = f;
            hideErrors();
            hideSuccess();
            document.getElementById('file-name').innerText = f.name;
            document.getElementById('file-size').innerText = fmtSize(f.size);
            const prev = document.getElementById('file-preview');
            prev.classList.remove('hidden');
            prev.classList.add('flex');
            syncSubmitEnabled();
        }
        function clearFile() {
            selectedFile = null;
            const prev = document.getElementById('file-preview');
            prev.classList.add('hidden');
            prev.classList.remove('flex');
            document.getElementById('file-name').innerText = '';
            document.getElementById('file-size').innerText = '';
            syncSubmitEnabled();
        }
        function syncSubmitEnabled() {
            document.getElementById('btn-submit').disabled = uploading || !selectedFile;
        }

        // 拖放
        (function setupDnD() {
            const dz = document.getElementById('dropzone');
            ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, (e) => {
                e.preventDefault(); e.stopPropagation();
                if (!uploading) dz.classList.add('is-over');
            }));
            ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, (e) => {
                e.preventDefault(); e.stopPropagation();
                dz.classList.remove('is-over');
            }));
            dz.addEventListener('drop', (e) => {
                if (uploading) return;
                const f = ((e.dataTransfer || {}).files || [])[0];
                if (f) acceptFile(f);
            });
        })();

        /* ===== 結果提示 ===== */
        function showSuccess(n) {
            document.getElementById('success-title').innerText = `已更新 ${n} 位員工`;
            const box = document.getElementById('success-box');
            box.classList.remove('hidden');
            box.classList.add('flex');
        }
        function hideSuccess() {
            const box = document.getElementById('success-box');
            box.classList.add('hidden');
            box.classList.remove('flex');
        }

        /* ===== 錯誤清單 ===== */
        function hideErrors() {
            document.getElementById('error-box').classList.add('hidden');
            document.getElementById('error-tbody').innerHTML = '';
            document.getElementById('error-count').innerText = '0 筆';
        }
        // 全部列出，不截斷
        function showErrors(errors) {
            const box = document.getElementById('error-box');
            document.getElementById('error-count').innerText = `${errors.length} 筆`;
            document.getElementById('error-tbody').innerHTML = errors.map(e => `<tr>
                <td class="px-3 py-2 font-mono text-gray-500">第 ${esc(e.row)} 列</td>
                <td class="px-3 py-2 font-medium text-gray-800">${esc(e.field)}</td>
                <td class="px-3 py-2 text-rose-600">${esc(e.reason)}</td>
            </tr>`).join('');
            box.classList.remove('hidden');
        }

        /* ===== 上傳 ===== */
        function setUploading(on) {
            uploading = on;
            const btn = document.getElementById('btn-submit');
            const icon = document.getElementById('btn-submit-icon');
            const text = document.getElementById('btn-submit-text');
            const clear = document.getElementById('file-clear');
            const dz = document.getElementById('dropzone');

            btn.disabled = on || !selectedFile;
            clear.disabled = on;
            // 上傳中鎖住移除檔案與拖放區，避免中途更換檔案
            [clear, dz].forEach(el => el.classList.toggle('opacity-50', on));
            [clear, dz].forEach(el => el.classList.toggle('pointer-events-none', on));
            icon.className = on ? 'fa-solid fa-spinner fa-spin' : 'fa-solid fa-cloud-arrow-up';
            text.innerText = on ? '更新中…' : '開始更新';
        }

        async function submitUpload() {
            if (uploading || !selectedFile) return;   // 防重送
            hideErrors();
            hideSuccess();
            setUploading(true);
            try {
                const res = await uploadPayItems(selectedFile);
                if (res.ok) {
                    showToast('success', `已更新 ${res.updated} 位員工`);
                    showSuccess(res.updated);
                    clearFile();
                } else {
                    showErrors(res.errors || []);
                    // 檔案保留，方便修正後重新上傳
                }
            } catch (err) {
                showToast('error', '上傳失敗，請稍後再試');
            } finally {
                setUploading(false);
            }
        }

        /* ===== 後端呼叫 =====
           正式版：
             const fd = new FormData(); fd.append('file', file);
             const r = await fetch(UPLOAD_URL, { method: 'POST', body: fd });
             return await r.json();   // { ok, updated, errors:[{row, field, reason}] }

           原型模擬：檔名含 "error" / "錯誤" → 回傳錯誤清單；否則回傳成功。 */
        function uploadPayItems(file) {
            return new Promise(resolve => setTimeout(() => {
                if (/error|錯誤/i.test(file.name)) {
                    resolve({
                        ok: false,
                        errors: [
                            { row: 2,  field: '工號',     reason: '工號 100999 不存在' },
                            { row: 3,  field: '生效月份', reason: '格式須為 YYYY-MM，實際為「2026/11」' },
                            { row: 5,  field: '底薪',     reason: '不可為負數（-1000）' },
                            { row: 7,  field: '幣別',     reason: '幣別 RMB 不在幣種主檔內' },
                            { row: 9,  field: '職務加給', reason: '非數值（「無」）' },
                            { row: 12, field: '工號',     reason: '工號重複，與第 4 列相同' },
                            { row: 14, field: '伙食津貼', reason: '超過單項上限 50,000' },
                            { row: 15, field: '生效月份', reason: '不可早於當前結算月份 2026-11' }
                        ]
                    });
                    return;
                }
                resolve({ ok: true, updated: MOCK_UPDATED });
            }, 900));
        }

        /* ===== Toast ===== */
        function showToast(type, text) {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toast-icon');
            document.getElementById('toast-text').innerText = text;
            const base = 'fixed bottom-5 right-5 z-[60] flex items-center gap-3 bg-gray-900 text-white px-5 py-3 rounded-xl shadow-modal transform transition-all duration-300 border ';
            if (type === 'error') { toast.className = base + 'border-rose-500/20'; icon.className = 'fa-solid fa-circle-xmark text-rose-400 text-base'; }
            else if (type === 'info') { toast.className = base + 'border-blue-500/20'; icon.className = 'fa-solid fa-circle-info text-blue-400 text-base'; }
            else { toast.className = base + 'border-emerald-500/20'; icon.className = 'fa-solid fa-circle-check text-emerald-400 text-base'; }
            toast.style.transform = 'translateY(0)';
            toast.style.opacity = '1';
            clearTimeout(window.__toastTimer);
            window.__toastTimer = setTimeout(() => {
                toast.style.transform = 'translateY(5rem)';
                toast.style.opacity = '0';
            }, 2600);
        }


    </script>
</body>
</html>
